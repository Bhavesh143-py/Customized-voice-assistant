version: "3.9"

# ── PVG Voice Assistant — Docker Compose ──────────────────────────────────────
# Works on both Linux and Windows with Docker Desktop
# Run on Linux:   docker compose up -d
# Run on Windows: docker compose up -d  (same command!)
#
# Services:
#   qdrant    → vector database (stores your embeddings)
#   ollama    → runs Qwen2.5 LLM + Nomic embeddings
#   backend   → FastAPI server (STT + RAG + LLM + TTS)
#   frontend  → Nginx serving index.html

services:

  # ── Qdrant Vector Database ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pvg_qdrant
    ports:
      - "6333:6333"       # REST API (browser dashboard at localhost:6333/dashboard)
      - "6334:6334"       # gRPC port
    volumes:
      - qdrant_data:/qdrant/storage   # embeddings saved to Docker volume (persistent)
    restart: unless-stopped

  # ── Ollama (LLM + Embeddings) ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: pvg_ollama
    ports:
      - "11434:11434"     # Ollama API
    gpus: all
    volumes:
      - ollama_data:/root/.ollama   # AI models saved here (2GB+, don't lose this!)
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped

  # ── Model Puller (runs once, pulls Qwen + Nomic into Ollama) ────────────────
  # This service runs ONCE on first setup, pulls models then exits
  model-puller:
    image: ollama/ollama:latest
    container_name: pvg_model_puller
    volumes:
      - ollama_data:/root/.ollama   # shares same volume as ollama service
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        echo 'Pulling Qwen2.5-3B (about 2GB, please wait...)...' &&
        ollama pull qwen2.5:3b --host http://pvg_ollama:11434 &&
        echo 'Pulling nomic-embed-text...' &&
        ollama pull nomic-embed-text --host http://pvg_ollama:11434 &&
        echo 'All models pulled successfully!'
      "
    restart: "no"   # run once only, don't restart

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .                  # project root — so Docker can see both backend/ and scripts/
      dockerfile: backend/Dockerfile
    container_name: pvg_backend
    ports:
      - "8000:8000"       # FastAPI + WebSocket endpoint
    gpus: all
    volumes:
      - ./data:/app/data                   # your .txt college files
      - ./tts_models:/app/tts_models       # Amy voice model files
      - ./scripts:/app/scripts             # ingest.py accessible inside container
      - whisper_cache:/root/.cache         # Whisper model cache (persistent)
    environment:
      # These tell main.py where to find other services
      # Container names on Docker network act as hostnames
      - QDRANT_HOST=pvg_qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=pvg_ollama
      - OLLAMA_PORT=11434
      - PIPER_MODEL_PATH=/app/tts_models/en_US-amy-medium.onnx
      - WHISPER_MODEL_SIZE=small.en        # use medium.en or large-v3 for better GPU quality
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE=float16
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped

  # ── Admin SQL Database (PostgreSQL) ─────────────────────────────────────────
  sql_database:
    image: postgres:16-alpine
    container_name: admin_postgres
    environment:
      - POSTGRES_DB=admin_db
      - POSTGRES_USER=admin_user
      - POSTGRES_PASSWORD=admin_pass
    ports:
      - "5432:5432"
    volumes:
      - admin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d admin_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Admin FastAPI Backend ───────────────────────────────────────────────────
  backend_admin:
    build:
      context: .
      dockerfile: admin/backend/Dockerfile
    container_name: admin_backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://admin_user:admin_pass@sql_database:5432/admin_db
      - VOICE_BACKEND_URL=http://pvg_backend:8000
    depends_on:
      sql_database:
        condition: service_healthy
    restart: unless-stopped

  # ── Data Ingester (runs once, ingests .txt files into Qdrant) ───────────────
  # Runs after backend is healthy, ingests data then exits
  ingester:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pvg_ingester
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
    environment:
      - QDRANT_HOST=pvg_qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=pvg_ollama
      - OLLAMA_PORT=11434
      - DATABASE_URL=postgresql://admin_user:admin_pass@sql_database:5432/admin_db
    depends_on:
      - qdrant
      - ollama
      - sql_database
    entrypoint: ["python3", "/app/scripts/ingest.py"]
    restart: "no"   # run once only

  # ── Frontend via Nginx ──────────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: pvg_frontend
    ports:
      - "3000:80"         # open http://localhost:3000 in browser
    volumes:
      - ./frontend:/usr/share/nginx/html:ro   # serves index.html (read-only)
    restart: unless-stopped

  # ── Admin Frontend via Nginx ────────────────────────────────────────────────
  frontend_admin:
    image: nginx:alpine
    container_name: admin_dashboard
    ports:
      - "3001:80"
    volumes:
      - ./admin/frontend.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - backend_admin
    restart: unless-stopped


# ── Named Volumes ───────────────────────────────────────────────────────────
# Docker manages these folders — persistent across container restarts
volumes:
  qdrant_data:      # stores your vector embeddings
  ollama_data:      # stores downloaded AI models
  whisper_cache:    # stores downloaded Whisper model
  admin_postgres_data:
