services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pvg_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: pvg_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Model puller: runs once, pulls gemma2:2b + nomic-embed-text ──────────────
  # To check status: docker logs pvg_model_puller
  # To re-pull:      docker compose run --rm model-puller
  model-puller:
    image: alpine:3.19
    container_name: pvg_model_puller
    volumes:
      - ./scripts:/scripts
    environment:
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-gemma2:2b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "/scripts/pull_models.sh"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pvg_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./tts_models:/app/tts_models:ro
      - ./scripts:/app/scripts
      - ~/.cache/huggingface:/root/.cache
      - db_data:/app/db
    env_file:
      - .env
    environment:
      - QDRANT_HOST=pvg_qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=pvg_ollama
      - OLLAMA_PORT=11434
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  ingester:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pvg_ingester
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
    env_file:
      - .env
    environment:
      - QDRANT_HOST=pvg_qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=pvg_ollama
      - OLLAMA_PORT=11434
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
    entrypoint: ["python3", "/app/scripts/ingest.py", "--data_dir", "/app/data"]
    restart: "no"

  frontend:
    image: nginx:alpine
    container_name: pvg_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
  whisper_cache:
  db_data: